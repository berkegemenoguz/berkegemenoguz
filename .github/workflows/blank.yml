name: Katkı animasyonu

on:
  schedule:
    - cron: '0 3 * * *'      # her gün 03:00 UTC
  workflow_dispatch:          # elle tetikleme
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: contrib-animation
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: SVG üret
        env:
          # GH_PAT tanımlıysa onu, değilse varsayılan token'ı kullanır.
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: node scripts/generate.mjs ${{ github.repository_owner }}

      - name: output dalına gönder
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan output
          git rm -rf --cached . > /dev/null
          git add -f dist/contrib-light.svg dist/contrib-dark.svg
          git commit -m "katkı animasyonu güncellendi ($(date -u +%Y-%m-%d))"
          git push -f origin output
